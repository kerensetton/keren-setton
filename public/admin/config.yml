# ─── Backend ──────────────────────────────────────────────────────────────────
# For production on Netlify: uses Netlify Identity + Git Gateway.
# For local dev (`npm run cms`): decap-server proxies to your local filesystem.
backend:
  name: git-gateway
  branch: main

local_backend: true

# ─── Media ────────────────────────────────────────────────────────────────────
media_folder: public/uploads/artist2
public_folder: /uploads/artist2

# ─── Collections ──────────────────────────────────────────────────────────────
collections:

  # ── Artist 2 — Site Settings (singleton) ──────────────────────────────────
  - name: artist2_settings
    label: "Artist 2 — Site Settings"
    files:
      - label: Site Settings
        name: main
        file: src/content/artist2-settings/main.json
        format: json
        fields:
          - { label: "Artist Name", name: artistName, widget: string }
          - { label: "Discipline", name: discipline, widget: string }
          - { label: "Location", name: location, widget: string }
          - { label: "Hero Image", name: heroImage, widget: image }
          - { label: "Hero CTA Button Text", name: heroCtaText, widget: string }
          - { label: "Contact Email", name: contactEmail, widget: string }

          - label: "Social Links"
            name: socials
            widget: list
            fields:
              - { label: "Platform Label", name: label, widget: string }
              - { label: "URL", name: href, widget: string }

          - { label: "About Page Photo", name: aboutPhoto, widget: image }
          - { label: "About Photo Caption", name: aboutPhotoCaption, widget: text }
          - { label: "About Lead Paragraph", name: aboutLead, widget: text }

          - label: "About Body Paragraphs"
            name: aboutBody
            widget: list
            field: { label: "Paragraph", name: paragraph, widget: text }

          - label: "Selected Exhibitions"
            name: exhibitions
            widget: list
            fields:
              - { label: "Exhibition Title", name: title, widget: string }
              - { label: "Venue", name: venue, widget: string }
              - { label: "City / Country", name: location, widget: string }
              - { label: "Year", name: year, widget: string }

          - label: "Press & Reviews"
            name: press
            widget: list
            fields:
              - { label: "Quote", name: quote, widget: text }
              - { label: "Publication", name: source, widget: string }
              - { label: "Author", name: author, widget: string }

  # ── Artist 2 — Projects ───────────────────────────────────────────────────
  - name: artist2_projects
    label: "Artist 2 — Projects"
    folder: src/content/artist2-projects
    create: true
    delete: true
    slug: "{{slug}}"
    format: frontmatter
    fields:
      - { label: "Project Title", name: title, widget: string }
      - { label: "Year", name: year, widget: string }
      - { label: "Medium", name: medium, widget: string }
      - { label: "Short Description", name: shortDesc, widget: text }
      - { label: "Cover Image", name: coverImage, widget: image }

      - label: "Project Images"
        name: images
        widget: list
        fields:
          - { label: "Image", name: src, widget: image }
          - { label: "Alt Text", name: alt, widget: string }
          - { label: "Caption", name: caption, widget: string, required: false }

      - { label: "Project Description", name: body, widget: markdown }
